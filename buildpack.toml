    version = "10.57.0"

    [[metadata.dependencies.licenses]]
      uri = "https://docs.newrelic.com/docs/licenses/license-information"

  [[metadata.dependency-constraints]]
    constraint = "9.*"
    id = "new-relic-java"
    patches = 2

  [[metadata.dependency-constraints]]
    constraint = "12.*"
    id = "new-relic-php"
    patches = 2

  [[metadata.dependency-constraints]]
